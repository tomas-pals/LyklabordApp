name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "research/**"
      - "store/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (empty = project.yml)
        required: false
        type: string
      assign_external:
        description: Also add Vinir (external TestFlight)
        required: false
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check App Store Connect key
        run: |
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ]; then
            echo "Add repo secret APP_STORE_CONNECT_API_KEY (AuthKey_H8RC4UN83P.p8 contents)."
            echo "Key ID / issuer are already in docs/TESTFLIGHT.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/ { print int($2) }')"
          if [ "$major" -lt 26 ]; then
            echo "Need Xcode 26+, got $(xcodebuild -version | tr '\n' ' ')"
            exit 1
          fi

      - name: Install xcodegen + asccli
        run: |
          brew install xcodegen asccli

      - name: Write API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          KEY_ID="${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          KEY_ID="${KEY_ID:-H8RC4UN83P}"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          ISSUER="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          echo "ASC_ISSUER_ID=${ISSUER:-bf2219f6-0d8f-4415-8449-1bef292d2146}" >> "$GITHUB_ENV"

      - name: Archive, export, upload
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ASSIGN_EXTERNAL: ${{ inputs.assign_external && '1' || '0' }}
        run: ./scripts/testflight-release.sh
