name: TestFlight

# Manual fallback only. Xcode Cloud is the ship path — a push trigger here
# would double-upload to TestFlight.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (empty = project.yml)
        required: false
        type: string
      assign_external:
        description: Also add your External TestFlight group
        required: false
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check App Store Connect secrets
        run: |
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ] || \
             [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ] || \
             [ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] || \
             [ -z "${{ secrets.APP_STORE_CONNECT_APP_ID }}" ]; then
            echo "Need repo secrets: APP_STORE_CONNECT_API_KEY (PEM), _API_KEY_ID, _ISSUER_ID, _APP_ID."
            echo "Mint the .p8 on team 45BXWF6V3P (tommipals@gmail.com)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/ { print int($2) }')"
          if [ "$major" -lt 26 ]; then
            echo "Need Xcode 26+, got $(xcodebuild -version | tr '\n' ' ')"
            exit 1
          fi

      - name: Install xcodegen + asccli
        run: |
          brew install xcodegen asccli

      - name: Write API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> "$GITHUB_ENV"
          echo "APP_ID=${{ secrets.APP_STORE_CONNECT_APP_ID }}" >> "$GITHUB_ENV"
          echo "INTERNAL_GROUP_ID=${{ secrets.APP_STORE_CONNECT_INTERNAL_GROUP_ID }}" >> "$GITHUB_ENV"
          echo "EXTERNAL_GROUP_ID=${{ secrets.APP_STORE_CONNECT_EXTERNAL_GROUP_ID }}" >> "$GITHUB_ENV"

      - name: Archive, export, upload
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ASSIGN_EXTERNAL: ${{ inputs.assign_external && '1' || '0' }}
        run: ./scripts/testflight-release.sh
